version: '3.9'

services:
  hyzs:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: hyzs-meeting:latest
    container_name: hyzs-meeting
    restart: unless-stopped
    volumes:
      - ./.uploads:/app/.uploads
      - ./org-data.json:/app/org-data.json
    ports:
      - "5000:5000"
    env_file:
      - .env          # 所有环境变量从 .env 文件注入，不会 bake 进镜像
    environment:
      - NODE_ENV=production
      - PORT=5000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
