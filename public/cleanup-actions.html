<!DOCTYPE html>
<html>
<head>
  <title>清理无效行动项</title>
</head>
<body>
  <h1>清理无效行动项</h1>
  <button onclick="cleanup()">执行清理</button>
  <pre id="result"></pre>
  <script>
    async function cleanup() {
      const result = document.getElementById('result');
      result.textContent = '执行中...';
      try {
        const res = await fetch('/api/debug/cleanup-orphan-actions', { method: 'POST' });
        const data = await res.json();
        result.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        result.textContent = '错误: ' + e.message;
      }
    }
  </script>
</body>
</html>
